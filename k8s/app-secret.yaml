# This holds the app's private settings - things that should not be shared
# or committed to a real git repository with real values in them.
#
# Like postgres-secret.yaml, we use "stringData" so we can write plain text
# and let Kubernetes do the base64 encoding for us.
#
# BEFORE you use this for anything real:
#   1. Change JWT_ACCESS_SECRET and JWT_REFRESH_SECRET to your own random
#      values. You can make one with: openssl rand -base64 48
#   2. Fill in SENDGRID_API_KEY, CLOUDINARY_*, and STRIPE_* if/when you
#      want those features turned on. Leaving them blank is fine - the app
#      falls back to printing to its logs instead of erroring.
#
# The DATABASE_URL below points at "postgres", which is the internal name
# given to the database in postgres-service.yaml. The username/password in
# it must match what's in postgres-secret.yaml.

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://queueva:queueva@postgres:5432/queueva"
  JWT_ACCESS_SECRET: "change-this-to-a-long-random-string-before-real-use"
  JWT_REFRESH_SECRET: "change-this-to-a-different-long-random-string"
  CRON_SECRET: "change-this-to-a-random-string-too"
  SENDGRID_API_KEY: ""
  SENDGRID_FROM_EMAIL: ""
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
