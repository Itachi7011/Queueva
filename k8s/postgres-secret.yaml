# This stores the database username and password.
# We use "stringData" (instead of "data") so we can write plain text here
# instead of having to base64-encode it ourselves - Kubernetes does that
# encoding for us automatically.
#
# In a real production setup, you would not commit real passwords into a
# file like this. You'd create the secret straight from the command line
# instead, for example:
#   kubectl create secret generic postgres-secret \
#     --from-literal=POSTGRES_USER=queueva \
#     --from-literal=POSTGRES_PASSWORD=some-strong-password \
#     --from-literal=POSTGRES_DB=queueva
# We're using a file here to keep things simple for testing.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: queueva
  POSTGRES_PASSWORD: queueva
  POSTGRES_DB: queueva
